packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@astrojs/svelte": ^9.1.1
  blume: ^2.2.6
  lefthook: ^2.2.2
  oxfmt: 0.75.0
  oxlint: 1.89.0
  svelte: ^5.57.3
  takumi-js: ^2.17.1
  # Svelte and Astro tooling (svelte-check, @astrojs/svelte) don't support
  # TypeScript 7 yet, so the workspace stays on 6.
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# The glibc and musl dev shells share this checkout's node_modules. Install
# both libc variants so a checkout installed under one shell still has the
# native bindings the other shell expects; otherwise pnpm installs only the
# libc of the shell that ran install and Vite+ cannot load its binding after
# a shell switch.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - glibc
    - musl

# Approve the install scripts the workspace needs. Blume's generated Astro
# project depends on esbuild, and lefthook installs the Git hooks from its
# postinstall. pnpm 12 refuses to run either without permission.
# https://useblume.dev/docs/quickstart
allowBuilds:
  esbuild: true
  lefthook: true
  "@scarf/scarf": false

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Node.js and pnpm are provided by the Nix dev shell (flake.nix, system-first
# mode); keep pnpm from downloading and switching toolchains on its own.
# https://viteplus.dev/guide/env
runtimeOnFail: ignore
pmOnFail: ignore
minimumReleaseAgeExclude:
  - "@lucide/svelte@1.62.0"
  - "@oxfmt/binding-android-arm-eabi@0.75.0"
  - "@oxfmt/binding-android-arm64@0.75.0"
  - "@oxfmt/binding-darwin-arm64@0.75.0"
  - "@oxfmt/binding-darwin-x64@0.75.0"
  - "@oxfmt/binding-freebsd-x64@0.75.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.75.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.75.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.75.0"
  - "@oxfmt/binding-linux-arm64-musl@0.75.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.75.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.75.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.75.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.75.0"
  - "@oxfmt/binding-linux-x64-gnu@0.75.0"
  - "@oxfmt/binding-linux-x64-musl@0.75.0"
  - "@oxfmt/binding-openharmony-arm64@0.75.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.75.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.75.0"
  - "@oxfmt/binding-win32-x64-msvc@0.75.0"
  - oxfmt@0.75.0
  - svelte@5.57.3
