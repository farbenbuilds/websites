packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@astrojs/svelte": ^9.1.0
  "@threlte/core": ^8.6.1
  "@types/node": ^26
  "@types/three": ^0.186.0
  blume: ^2.2.4
  gsap: ^3.15.0
  lefthook: ^2.2.2
  oxfmt: 0.73.0
  oxlint: 1.88.0
  svelte: ^5.57.2
  takumi-js: ^2.17.1
  three: ^0.186.1
  # Svelte and Astro tooling (svelte-check, @astrojs/svelte) don't support
  # TypeScript 7 yet, so the workspace stays on 6.
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

# The glibc and musl dev shells share this checkout's node_modules. Install
# both libc variants so a checkout installed under one shell still has the
# native bindings the other shell expects; otherwise pnpm installs only the
# libc of the shell that ran install and Vite+ cannot load its binding after
# a shell switch.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - glibc
    - musl

# Approve the install scripts the workspace needs. Blume's generated Astro
# project depends on esbuild, and lefthook installs the Git hooks from its
# postinstall. pnpm 12 refuses to run either without permission.
# https://useblume.dev/docs/quickstart
allowBuilds:
  esbuild: true
  lefthook: true
  "@scarf/scarf": false

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Node.js and pnpm are provided by the Nix dev shell (flake.nix, system-first
# mode); keep pnpm from downloading and switching toolchains on its own.
# https://viteplus.dev/guide/env
runtimeOnFail: ignore
pmOnFail: ignore
minimumReleaseAgeExclude:
  - blume@2.2.4
  - "@lucide/svelte@1.59.0"
