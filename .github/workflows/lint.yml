name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.svelte"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.yaml"
      - "**/*.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "lefthook.yml"
      - "scripts/**"
      - "tools/**"
      - ".github/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.svelte"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.yaml"
      - "**/*.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "lefthook.yml"
      - "scripts/**"
      - "tools/**"
      - ".github/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format, typecheck, and size
    environment: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12.15.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check file size
        run: pnpm check:size
